
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Tutor - Your Personal Teacher</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.app {
    width: 100%;
    max-width: 850px;
    height: 95vh;
    background: #1e293b;
    border-radius: 18px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid #334155;
}

header {
    padding: 20px;
    background: #111827;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

header h2 {
    color: #38bdf8;
}

header p {
    font-size: 12px;
    color: #94a3b8;
    margin-top: 5px;
}

.status {
    color: #4ade80;
    font-size: 12px;
}

.settings {
    padding: 12px 18px;
    background: #263449;
}

.settings input {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #475569;
    background: #0f172a;
    color: white;
    outline: none;
}

.settings small {
    color: #94a3b8;
    display: block;
    margin-top: 5px;
}

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
}

.message {
    padding: 13px 16px;
    margin-bottom: 15px;
    border-radius: 12px;
    max-width: 85%;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.bot {
    background: #334155;
    align-self: flex-start;
}

.user {
    background: #0369a1;
    margin-left: auto;
}

.input-area {
    padding: 15px;
    background: #111827;
    display: flex;
    gap: 10px;
}

.input-area textarea {
    flex: 1;
    resize: none;
    height: 50px;
    padding: 14px;
    border-radius: 10px;
    background: #1e293b;
    color: white;
    border: 1px solid #475569;
    outline: none;
    font-size: 15px;
}

button {
    border: none;
    background: #0284c7;
    color: white;
    padding: 12px 20px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #0369a1;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.footer {
    text-align: center;
    font-size: 11px;
    padding: 8px;
    color: #64748b;
}
</style>
</head>

<body>

<div class="app">

<header>
    <div>
        <h2>🎓 AI Tutor</h2>
        <p>Your Personal AI Teacher</p>
    </div>
    <div class="status">● Online</div>
</header>

<div class="settings">
    <input
        type="password"
        id="apiKey"
        placeholder="Paste your Gemini API Key here..."
    >
    <small>Gemini API key required to start chatting.</small>
</div>

<div class="chat" id="chat">
    <div class="message bot">
        👋 Hello Student!

        Main aapka AI Tutor hoon.

        Aap mujhse Maths, Science, English, Computer aur kisi bhi subject ke questions pooch sakte hain.

        Aaj hum kya seekhenge? 😊
    </div>
</div>

<div class="input-area">
    <textarea
        id="question"
        placeholder="Ask your question..."
    ></textarea>

    <button id="sendBtn" onclick="sendMessage()">Send ➤</button>
</div>

<div class="footer">
    Powered by Google Gemini AI
</div>

</div>

<script>

const MODEL = "gemini-2.5-flash";

const chat = document.getElementById("chat");
const questionInput = document.getElementById("question");
const apiKeyInput = document.getElementById("apiKey");
const sendBtn = document.getElementById("sendBtn");

let history = [];

function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
}

async function sendMessage() {

    const question = questionInput.value.trim();
    const apiKey = apiKeyInput.value.trim();

    if (!question) return;

    if (!apiKey) {
        alert("Please enter your Gemini API Key!");
        apiKeyInput.focus();
        return;
    }

    addMessage(question, "user");

    questionInput.value = "";
    sendBtn.disabled = true;
    sendBtn.textContent = "...";

    const loading = addMessage("🤖 AI Tutor is thinking...", "bot");

    const newHistory = [
        ...history,
        {
            role: "user",
            parts: [{ text: question }]
        }
    ];

    try {

        const response = await fetch(
            `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`,
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "x-goog-api-key": apiKey
                },
                body: JSON.stringify({
                    systemInstruction: {
                        parts: [{
                            text: `You are a friendly and expert AI Tutor.
Teach students in simple Hindi or English according to their language.
Explain concepts step by step.
Give examples and practice questions.
For mathematics, show calculations step by step.
Be patient, encouraging and educational.
If a student makes a mistake, explain the correct answer kindly.`
                        }]
                    },
                    contents: newHistory,
                    generationConfig: {
                        temperature: 0.7,
                        maxOutputTokens: 2048
                    }
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                data.error?.message || "API request failed"
            );
        }

        const answer =
            data.candidates?.[0]?.content?.parts
                ?.map(part => part.text || "")
                .join("")
                .trim();

        if (!answer) {
            throw new Error("AI did not return a text response.");
        }

        loading.textContent = answer;

        history = [
            ...newHistory,
            {
                role: "model",
                parts: [{ text: answer }]
            }
        ];

    } catch (error) {

        loading.textContent =
            "❌ Error: " + error.message;

    } finally {

        sendBtn.disabled = false;
        sendBtn.textContent = "Send ➤";
        chat.scrollTop = chat.scrollHeight;

    }
}

questionInput.addEventListener("keydown", function(e) {
    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
});

</script>

</body>
</html>
